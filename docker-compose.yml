services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - TURN_HOST=${DOMAIN}
      - TURN_SECRET=${TURN_SECRET}
      - TURN_TLS=1
      - MAX_PEERS=${MAX_PEERS:-8}
      # Свой TURN есть — внешние STUN не нужны (так ничего не ходит за границу)
      - STUN_URLS=

  caddy:  # HTTPS-сертификат получает сам (Let's Encrypt)
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment: [DOMAIN=${DOMAIN}]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

  coturn:  # TURN-сервер: пробивает NAT и мобильные сети
    image: coturn/coturn:4.6
    restart: unless-stopped
    network_mode: host
    user: "0:0"   # чтобы читать TLS-сертификат Caddy
    volumes:
      - caddy_data:/certs:ro
    command:
      - -n
      - --listening-port=3478
      - --tls-listening-port=5349
      - --external-ip=${PUBLIC_IP}
      - --realm=${DOMAIN}
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      - --min-port=49160
      - --max-port=49200
      - --fingerprint
      - --no-cli
      - --no-multicast-peers
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --cert=/certs/caddy/certificates/acme-v02.api.letsencrypt.org-directory/${DOMAIN}/${DOMAIN}.crt
      - --pkey=/certs/caddy/certificates/acme-v02.api.letsencrypt.org-directory/${DOMAIN}/${DOMAIN}.key

volumes:
  caddy_data:
