<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Созвон</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%235b8cff'/><path d='M6 8h8v8H6zM15 11l4-2.5v7L15 13z' fill='white'/></svg>">
<style>
:root{--bg:#0e1015;--panel:#171a21;--panel2:#1f232c;--line:#2a2f3a;--text:#e8eaf0;--mute:#8b92a3;--acc:#5b8cff;--red:#ef4b4b;--green:#3ecf8e;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
.hidden{display:none!important}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* --- lobby --- */
#lobby{min-height:100%;display:grid;place-items:center;padding:24px}
.lobby-card{display:grid;grid-template-columns:minmax(0,560px) 320px;gap:28px;align-items:center;max-width:960px;width:100%}
@media(max-width:820px){.lobby-card{grid-template-columns:1fr}}
.form h1{margin:0 0 4px;font-size:28px}
.form .sub{color:var(--mute);margin:0 0 18px}
label.f{display:block;margin-bottom:12px;color:var(--mute);font-size:13px}
label.f input{display:block;width:100%;margin-top:6px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);outline:none}
label.f input:focus{border-color:var(--acc)}
.row{display:flex;gap:10px;margin:14px 0}
.primary{width:100%;padding:13px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-weight:600;cursor:pointer}
.primary:hover{filter:brightness(1.1)}
.hint{color:var(--mute);font-size:13px;min-height:1.4em}
.hint.err{color:#ff8a8a}

/* --- tiles --- */
.tile{position:relative;background:#000;border-radius:var(--r);overflow:hidden;aspect-ratio:16/9;min-height:0;outline:3px solid transparent;transition:outline-color .15s}
.tile video{width:100%;height:100%;object-fit:cover;display:block;background:#000}
.tile.screen video{object-fit:contain}
.tile.mirror video{transform:scaleX(-1)}
.tile .avatar{position:absolute;inset:0;display:none;place-items:center;background:var(--panel2)}
.tile .avatar b{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:34px;font-weight:600;color:#fff}
.tile.novideo .avatar{display:grid}
.tile.novideo video{visibility:hidden}
.tile .label{position:absolute;left:10px;bottom:10px;display:flex;gap:6px;align-items:center;background:rgba(0,0,0,.55);padding:4px 9px;border-radius:8px;font-size:13px;max-width:calc(100% - 20px)}
.tile .label .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .label .mo{display:none;color:var(--red)}
.tile.micoff .label .mo{display:inline}
.tile .label .mo svg{width:15px;height:15px}
.tile .st{position:absolute;top:10px;left:10px;font-size:12px;background:rgba(0,0,0,.6);padding:3px 8px;border-radius:6px;display:none}
.tile .st:not(:empty){display:block}
.tile .hand{position:absolute;top:8px;right:10px;font-size:24px;display:none}
.tile.hand .hand{display:block}
.tile.speaking{outline-color:var(--green)}
.tile .fs{position:absolute;top:8px;right:8px;opacity:0;background:rgba(0,0,0,.55);border:0;border-radius:8px;padding:6px;cursor:pointer;transition:opacity .15s}
.tile:hover .fs{opacity:1}
@media(hover:none){.tile .fs{opacity:.85}}
.tile .fs svg{width:18px;height:18px}
.tile:fullscreen video{object-fit:contain}
.meter{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.08)}
.meter i{display:block;height:100%;width:0;background:var(--green);transition:width .08s}

/* --- call --- */
#call{height:100vh;height:100dvh;display:flex;flex-direction:column}
#call header{display:flex;align-items:center;gap:12px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));border-bottom:1px solid var(--line)}
#call header .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
#copy .short{display:none}
#call header .t{font-weight:600}
#call header .c{color:var(--mute);font-size:13px}
#call header .sp{flex:1}
.ghost{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 12px;cursor:pointer;font-size:13px}
.ghost:hover{border-color:var(--acc)}
main{flex:1;display:flex;min-height:0}
#grid{position:relative;flex:1;display:flex;flex-wrap:wrap;gap:10px;padding:12px;justify-content:center;align-content:center;min-height:0;min-width:0;overflow:auto}
#grid .tile{cursor:pointer;width:var(--tw,320px);height:var(--th,180px);aspect-ratio:auto;flex:none}
#grid.focus{display:grid;grid-template-columns:1fr 220px;grid-auto-rows:min-content;align-content:start}
#grid.focus .tile{width:auto;height:auto;aspect-ratio:16/9}
#grid.focus .tile.pinned{grid-column:1;grid-row:1/span 50;aspect-ratio:auto;height:calc(100vh - 160px)}
#grid.focus .tile:not(.pinned){grid-column:2}
@media(max-width:700px),(max-height:500px){
  #grid.focus{grid-template-columns:repeat(3,1fr);gap:8px;padding:8px}
  #grid.focus .tile.pinned{grid-column:1/-1;grid-row:1;height:calc(var(--gh,400px) - 136px);min-height:200px}
  #grid.focus .tile:not(.pinned){grid-column:auto;aspect-ratio:auto;height:112px}
  /* звонок вдвоём: собеседник на весь экран, вы — в углу */
  #grid.duo{display:block;padding:8px}
  #grid.duo .tile{width:100%;height:100%}
  #grid.duo .tile.self{position:absolute;right:16px;bottom:16px;width:28vw;max-width:150px;height:auto;aspect-ratio:3/4;z-index:2;box-shadow:0 6px 20px rgba(0,0,0,.5)}
  #grid.duo .tile.self .label{left:6px;bottom:6px;font-size:11px;padding:2px 6px}
  #grid.duo .tile.self .avatar b{width:44px;height:44px;font-size:18px}
  #grid.duo .tile.self .fs{display:none}
  @media(orientation:landscape){#grid.duo .tile.self{width:auto;height:38%;max-width:none;aspect-ratio:4/3}#grid.focus{grid-template-columns:1fr 160px}#grid.focus .tile.pinned{grid-column:1;grid-row:1/span 20;height:calc(var(--gh,300px) - 16px)}#grid.focus .tile:not(.pinned){grid-column:2;aspect-ratio:4/3}}
  .tile .avatar b{width:64px;height:64px;font-size:26px}
}

#chat{width:330px;border-left:1px solid var(--line);display:flex;flex-direction:column;background:var(--panel)}
@media(max-width:700px),(max-height:500px){#chat{position:fixed;inset:0;bottom:var(--fh,70px);width:auto;z-index:5;padding-top:env(safe-area-inset-top)}}
.chat-h{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:600}
.chat-h button{background:none;border:0;font-size:22px;cursor:pointer;color:var(--mute)}
#msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:85%;align-self:flex-start}
.msg.me{align-self:flex-end;text-align:right}
.msg .who{font-size:12px;color:var(--mute);margin-bottom:2px}
.msg .bub{display:inline-block;text-align:left;background:var(--panel2);padding:7px 11px;border-radius:12px;white-space:pre-wrap;word-break:break-word}
.msg.me .bub{background:var(--acc);color:#fff}
.msg .bub a{color:inherit}
.sys{align-self:center;color:var(--mute);font-size:12px}
#chatForm{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
#chatForm input{flex:1;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);outline:none}
#chatForm button{border:0;background:var(--acc);color:#fff;border-radius:10px;padding:0 14px;cursor:pointer}

footer{display:flex;justify-content:center;gap:10px;padding:12px;padding-bottom:max(12px,env(safe-area-inset-bottom));border-top:1px solid var(--line);flex-wrap:wrap}
@media(max-width:700px),(max-height:500px){
  footer{gap:6px;padding:10px 8px;padding-bottom:max(10px,env(safe-area-inset-bottom));flex-wrap:nowrap}
  footer{gap:5px}
  footer .ctl{width:clamp(34px,10.2vw,46px);height:clamp(34px,10.2vw,46px)}
  footer .ctl.leave{width:clamp(42px,12.5vw,60px)}
  footer .ctl .badge{top:-2px;right:-2px}
  footer .ctl svg{width:20px;height:20px}
  .ctl[data-tip]:hover::after{display:none}
  #call header{padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));gap:8px}
  #copy .long{display:none}#copy .short{display:inline}
}
.ctl{position:relative;width:52px;height:52px;border-radius:50%;border:0;background:var(--panel2);display:grid;place-items:center;cursor:pointer;transition:background .15s}
.ctl:hover{background:#2b303b}
.ctl.off{background:var(--red);color:#fff}
.ctl.on{background:var(--acc);color:#fff}
.ctl.leave{background:var(--red);color:#fff;width:68px;border-radius:26px}
.ctl .badge{position:absolute;top:2px;right:2px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 4px}
.ctl[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:60px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#000;padding:4px 8px;border-radius:6px;font-size:12px;pointer-events:none}


/* --- игры --- */
#games{width:440px;border-left:1px solid var(--line);display:flex;flex-direction:column;background:var(--panel);min-height:0}
@media(max-width:700px),(max-height:500px){#games{position:fixed;inset:0;bottom:var(--fh,70px);width:auto;z-index:6;padding-top:env(safe-area-inset-top)}}
#gameBody{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.gl{display:grid;gap:10px}
.gcard{display:flex;gap:12px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;text-align:left;width:100%}
.gcard:hover{border-color:var(--acc)}
.gcard .ico{font-size:30px;width:44px;text-align:center}
.gcard b{display:block}.gcard small{color:var(--mute)}
.gbtns{display:flex;gap:8px;flex-wrap:wrap}
.gbtn{flex:1;min-width:110px;padding:11px 12px;border-radius:10px;border:0;background:var(--acc);color:#fff;font-weight:600;cursor:pointer}
.gbtn.sec{background:var(--panel2);border:1px solid var(--line);color:var(--text)}
.gbtn.warn{background:#e0892a}
.gbtn:disabled{opacity:.45;cursor:default}
.plist{display:flex;flex-direction:column;gap:6px}
.plist div{background:var(--panel2);border-radius:8px;padding:8px 10px;display:flex;justify-content:space-between}
.gstatus{background:var(--panel2);border-radius:10px;padding:10px 12px;font-weight:600;display:flex;justify-content:space-between;gap:8px;align-items:center}
.gstatus.my{background:#24345e;border:1px solid var(--acc)}
.gstatus .tm{font-variant-numeric:tabular-nums;color:var(--mute);font-weight:500;white-space:nowrap}
.gstatus .tm.low{color:#ff8a8a}
.opps{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.opp{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px;text-align:center;min-width:76px}
.opp.att{border-color:#e0892a}.opp.def{border-color:var(--acc)}.opp.out{opacity:.5}
.opp .cnt{font-size:12px;color:var(--mute)}
.board{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;min-height:120px;background:#13401f;border-radius:14px;padding:12px;--w:46px}
.deckbox{position:relative;width:calc(var(--w) + 26px);height:calc(var(--w)*1.4);flex:none}
.deckbox .card{position:absolute}
.deckbox .trumpc{left:24px;top:8px;transform:rotate(90deg)}
.deckbox .n{position:absolute;left:0;bottom:-18px;font-size:12px;color:#cfe;white-space:nowrap}
.board{padding-bottom:26px}
.tbl{display:flex;flex-wrap:wrap;gap:10px 22px;justify-content:center;flex:1;min-width:0}
.pair{position:relative;width:calc(var(--w) + 14px);height:calc(var(--w)*1.4 + 14px);flex:none}
.pair .d{position:absolute;left:14px;top:14px;transform:rotate(6deg)}
.pair.target .card:first-child{outline:3px dashed #ffd84d;cursor:pointer;animation:pulse 1s infinite}
@keyframes pulse{50%{outline-color:transparent}}
.card{--w:52px;width:var(--w);height:calc(var(--w)*1.4);border-radius:7px;background:#fff;color:#16181d;display:flex;flex-direction:column;justify-content:space-between;padding:3px 4px;font:700 calc(var(--w)*.3)/1 system-ui,sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.35);user-select:none;-webkit-user-select:none;flex:none;transition:transform .12s;touch-action:manipulation}
.board .card{--w:inherit}
.card.red{color:#d42a2a}
.card .c{align-self:center;font-size:calc(var(--w)*.5)}
.card .r2{align-self:flex-end;transform:rotate(180deg)}
.card.back{background:repeating-linear-gradient(45deg,#3d55c9 0 5px,#2f43a8 5px 10px);border:2px solid #fff}
.hand{display:flex;justify-content:center;padding:16px 4px 4px;--w:56px;min-height:100px}
.hand .card{--w:inherit;cursor:default;position:relative}
.hand .card+.card{margin-left:var(--ov,4px)}
.hand .card.ok{cursor:pointer;box-shadow:0 0 0 3px var(--green),0 2px 6px rgba(0,0,0,.35);transform:translateY(-8px)}
.hand .card.sel{box-shadow:0 0 0 3px #ffd84d,0 2px 6px rgba(0,0,0,.35);transform:translateY(-16px)}
.hand .card.no{filter:brightness(.6)}
.glog{font-size:12px;color:var(--mute);text-align:center;min-height:1em}
.ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(100%,320px);margin:0 auto}
.ttt button{aspect-ratio:1;border-radius:12px;border:0;background:var(--panel2);font:700 46px/1 system-ui;color:var(--text);cursor:pointer}
.ttt button.X{color:#5b8cff}.ttt button.O{color:#ff9f43}
.ttt button.win{background:#1f4d33}
.ttt button:disabled{cursor:default}
.ttt button.can:hover{background:#2b303b}

.spycard{border-radius:14px;padding:18px 14px;text-align:center;cursor:pointer;user-select:none;-webkit-user-select:none;background:linear-gradient(135deg,#1f3b2a,#173024);border:1px solid #2f6b47}
.spycard.spy{background:linear-gradient(135deg,#3b1f2a,#2a1720);border-color:#7a2f47}
.spycard.hid{background:var(--panel2);border-color:var(--line)}
.spycard .big{font-size:24px;font-weight:700;margin:4px 0}
.spycard small{color:var(--mute)}
.acc{background:#3a2a12;border:1px solid #e0892a;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.prow{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--panel2);border-radius:10px;padding:8px 10px}
.prow .nm2{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .tag{font-size:12px;color:var(--mute)}
.prow .sb{border:0;border-radius:8px;padding:7px 10px;background:#e0892a;color:#fff;font-weight:600;cursor:pointer;white-space:nowrap}
.prow .sb.sure{background:var(--red)}
.prow .sb.vote{background:var(--acc)}
.locs{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px}
.locs button{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:8px 6px;font-size:13px;cursor:pointer;text-align:center}
.locs button.x{text-decoration:line-through;opacity:.4}
.locs button.pick{border-color:#ffd84d;background:#3a3412}
details.lc summary{cursor:pointer;color:var(--mute);font-size:13px;padding:4px 0}
.gres{text-align:center;font-size:20px;font-weight:700;padding:6px 0}
/* --- settings --- */
dialog{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:16px;padding:0;width:min(520px,94vw)}
dialog::backdrop{background:rgba(0,0,0,.6)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);font-weight:600;font-size:17px}
.dlg-h button{background:none;border:0;font-size:24px;cursor:pointer;color:var(--mute)}
.dlg-b{padding:16px 20px;max-height:70vh;overflow:auto}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px}
.tabs button.act{border-color:var(--acc);color:var(--acc)}
.fld{margin-bottom:14px}
.fld>span{display:block;font-size:13px;color:var(--mute);margin-bottom:6px}
.fld select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.fld .inl{display:flex;gap:8px;align-items:center}
.fld .inl select{flex:1}
.bar{height:8px;border-radius:4px;background:var(--bg);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;width:0;background:var(--green);transition:width .08s}
.chk{display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--acc)}
.chk small{display:block;color:var(--mute)}
.prevS{border-radius:10px;overflow:hidden;margin-bottom:14px;aspect-ratio:16/9;background:#000}
.prevS video{width:100%;height:100%;object-fit:cover}
#toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top));width:max-content;max-width:min(440px,92vw);transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:50;pointer-events:none}
#toast div{background:#000d;border:1px solid var(--line);padding:9px 14px;border-radius:10px;font-size:14px;animation:fade 4s forwards}
@keyframes fade{0%{opacity:0;transform:translateY(-6px)}8%,85%{opacity:1;transform:none}100%{opacity:0}}
@media(max-width:700px),(max-height:500px){#toast{top:auto;bottom:calc(var(--fh,70px) + 10px);flex-direction:column-reverse}}
</style>
</head>
<body>

<!-- ЛОББИ -->
<section id="lobby">
  <div class="lobby-card">
    <div class="tile mirror" id="pvTile">
      <video id="pv" autoplay playsinline muted></video>
      <div class="avatar"><b id="pvAv">?</b></div>
      <div class="meter"><i id="pvMeter"></i></div>
    </div>
    <div class="form">
      <h1>Созвон</h1>
      <p class="sub">Видеозвонки, чат и демонстрация экрана</p>
      <label class="f">Ваше имя<input id="name" maxlength="40" placeholder="Как вас зовут?"></label>
      <label class="f">Комната<input id="room" maxlength="64" placeholder="название-комнаты"></label>
      <div class="row">
        <button class="ctl" id="lMic" data-tip="Микрофон"></button>
        <button class="ctl" id="lCam" data-tip="Камера"></button>
        <button class="ctl" id="lSet" data-tip="Настройки"></button>
      </div>
      <button class="primary" id="join">Войти в комнату</button>
      <p class="hint" id="hint"></p>
    </div>
  </div>
</section>

<!-- ЗВОНОК -->
<section id="call" class="hidden">
  <header>
    <span class="t" id="roomTitle"></span>
    <span class="c" id="count"></span>
    <span class="sp"></span>
    <button class="ghost" id="copy"><span class="long">Скопировать ссылку</span><span class="short">🔗 Ссылка</span></button>
  </header>
  <main>
    <div id="grid"></div>
    <aside id="chat" class="hidden">
      <div class="chat-h">Чат <button id="chatClose" aria-label="Закрыть">×</button></div>
      <div id="msgs"></div>
      <form id="chatForm"><input id="chatInput" placeholder="Сообщение…" autocomplete="off" maxlength="4000"><button aria-label="Отправить">➤</button></form>
    </aside>
    <aside id="games" class="hidden">
      <div class="chat-h"><span id="gamesTitle">Игры</span> <button id="gamesClose" aria-label="Закрыть">×</button></div>
      <div id="gameBody"></div>
    </aside>
  </main>
  <footer>
    <button class="ctl" id="bMic" data-tip="Микрофон (M)"></button>
    <button class="ctl" id="bCam" data-tip="Камера (V)"></button>
    <button class="ctl" id="bScreen" data-tip="Демонстрация экрана"></button>
    <button class="ctl" id="bHand" data-tip="Поднять руку">✋</button>
    <button class="ctl" id="bChat" data-tip="Чат"><span class="badge hidden" id="unread">0</span></button>
    <button class="ctl" id="bGames" data-tip="Игры"><span class="badge hidden" id="gbadge">!</span></button>
    <button class="ctl" id="bSet" data-tip="Настройки"></button>
    <button class="ctl leave" id="bLeave" data-tip="Выйти"></button>
  </footer>
</section>

<!-- НАСТРОЙКИ -->
<dialog id="dlg">
  <div class="dlg-h">Настройки <button id="dlgClose" aria-label="Закрыть">×</button></div>
  <div class="dlg-b">
    <div class="tabs"><button data-tab="dev" class="act">Устройства</button><button data-tab="audio">Звук</button><button data-tab="video">Видео</button></div>
    <div data-pane="dev">
      <div class="prevS"><video id="sPrev" autoplay playsinline muted></video></div>
      <label class="fld"><span>Камера</span><select id="sCam"></select></label>
      <label class="fld"><span>Микрофон</span><select id="sMic"></select><div class="bar"><i id="sMeter"></i></div></label>
      <div class="fld" id="spkFld"><span>Динамики / наушники</span>
        <div class="inl"><select id="sSpk"></select><button class="ghost" id="testSnd" type="button">Проверить</button></div></div>
    </div>
    <div data-pane="audio" class="hidden">
      <label class="chk"><input type="checkbox" id="sEc"><div>Эхоподавление<small>Убирает эхо, если звук идёт из колонок</small></div></label>
      <label class="chk"><input type="checkbox" id="sNs"><div>Шумоподавление<small>Глушит фоновый шум: вентилятор, клавиатуру</small></div></label>
      <label class="chk"><input type="checkbox" id="sAgc"><div>Автоусиление громкости<small>Выравнивает громкость голоса</small></div></label>
      <label class="chk"><input type="checkbox" id="sJoinMuted"><div>Входить с выключенным микрофоном</div></label>
    </div>
    <div data-pane="video" class="hidden">
      <label class="fld"><span>Качество камеры</span><select id="sRes"><option value="360">360p (экономия трафика)</option><option value="720">720p HD</option><option value="1080">1080p Full HD</option></select></label>
      <label class="fld"><span>Частота кадров</span><select id="sFps"><option>15</option><option>24</option><option>30</option></select></label>
      <label class="fld"><span>Демонстрация экрана</span><select id="sScr"><option value="detail">Чёткость (текст, код, слайды)</option><option value="motion">Плавность (видео, игры)</option></select></label>
      <label class="chk"><input type="checkbox" id="sMirror"><div>Зеркалить своё видео<small>Только у вас, собеседники видят как обычно</small></div></label>
      <label class="chk"><input type="checkbox" id="sJoinNoCam"><div>Входить с выключенной камерой</div></label>
    </div>
  </div>
</dialog>
<div id="toast"></div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const IC = {
  mic:'<svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/></svg>',
  micOff:'<svg viewBox="0 0 24 24"><path d="M3 3l18 18M9 9v1a3 3 0 0 0 5.1 2.1M15 9.3V5a3 3 0 0 0-5.9-.7M5 10a7 7 0 0 0 11.2 5.6M19 10a7 7 0 0 1-.6 2.8M12 17v5"/></svg>',
  cam:'<svg viewBox="0 0 24 24"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="M16 10l6-3v10l-6-3z"/></svg>',
  camOff:'<svg viewBox="0 0 24 24"><path d="M3 3l18 18M16 10l6-3v10l-4-2M14 18H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h2M10 6h4a2 2 0 0 1 2 2v4"/></svg>',
  screen:'<svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4M9 10l3-3 3 3M12 7v6"/></svg>',
  chat:'<svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.8 7L3 21l2-6.2A8 8 0 1 1 21 12z"/></svg>',
  gear:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  leave:'<svg viewBox="0 0 24 24"><path d="M3 15c5-4.5 13-4.5 18 0l-2.5 2.5-3-1.5v-2.5a12 12 0 0 0-7 0V16l-3 1.5z" fill="currentColor"/></svg>',
  game:'<svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="11" rx="5.5"/><path d="M7 10.5v4M5 12.5h4"/><circle cx="15.5" cy="11.5" r=".9" fill="currentColor"/><circle cx="17.5" cy="13.8" r=".9" fill="currentColor"/></svg>',
  full:'<svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>',
};

// ---------- настройки ----------
const S = Object.assign({cam:'',mic:'',spk:'',res:'720',fps:'30',scr:'detail',ec:true,ns:true,agc:true,mirror:true,joinMuted:false,joinNoCam:false,name:''},
  JSON.parse(localStorage.getItem('sozvon') || '{}'));
const save = () => localStorage.setItem('sozvon', JSON.stringify(S));

// ---------- состояние ----------
const local = { audio:null, video:null };
let micOn = !S.joinMuted, camOn = !S.joinNoCam, hand = false;
let screen = null, mix = null;
let me = null, token = null, roomName = '', es = null, iceServers = [], inCall = false, leaving = false;
const peers = new Map();
let selfTile = null, pinned = null, unread = 0, actx = null;

const toast = t => { const d = document.createElement('div'); d.textContent = t; $('#toast').append(d); setTimeout(() => d.remove(), 4000); };
const ac = () => (actx ||= new (window.AudioContext || window.webkitAudioContext)());
const hue = s => [...s].reduce((a, c) => a + c.charCodeAt(0), 0) % 360;

// ---------- медиа ----------
const RES = { '360':[640,360], '720':[1280,720], '1080':[1920,1080] };
const aC = () => ({ deviceId: S.mic ? { exact:S.mic } : undefined, echoCancellation:S.ec, noiseSuppression:S.ns, autoGainControl:S.agc });
const vC = () => { const [w,h] = RES[S.res]; return { deviceId: S.cam ? { exact:S.cam } : undefined, width:{ideal:w}, height:{ideal:h}, frameRate:{ideal:+S.fps} }; };
const gUM = c => navigator.mediaDevices.getUserMedia(c);

async function acquire(kind) {
  try { return (await gUM({ [kind]: kind === 'audio' ? aC() : vC() })).getTracks()[0]; }
  catch (e) {
    if (e.name === 'OverconstrainedError' || e.name === 'NotFoundError' || e.name === 'NotReadableError') {
      if (kind === 'audio') S.mic = ''; else S.cam = '';
      try { return (await gUM({ [kind]: kind === 'audio' ? aC() : vC() })).getTracks()[0]; } catch (e2) { e = e2; }
    }
    mediaError(kind, e); return null;
  }
}
function mediaError(kind, e) {
  const what = kind === 'audio' ? 'микрофону' : 'камере';
  const msg = e.name === 'NotAllowedError' ? `Нет доступа к ${what} — разрешите его в адресной строке браузера`
    : e.name === 'NotFoundError' ? `Не найдено устройство: ${kind === 'audio' ? 'микрофон' : 'камера'}`
    : e.name === 'NotReadableError' ? `${kind === 'audio' ? 'Микрофон' : 'Камера'} занят(а) другой программой`
    : `Ошибка доступа к ${what}: ${e.name}`;
  toast(msg); setHint(msg, true);
}
function setAudio(t) {
  if (local.audio && local.audio !== t) local.audio.stop();
  local.audio = t;
  if (t) { t.enabled = micOn; t.onended = () => { toast('Микрофон отключился'); }; }
  if (screen) buildMix();
  setupSelfMeter(); refreshOutgoing();
}
function setVideo(t) {
  if (local.video && local.video !== t) local.video.stop();
  local.video = t;
  if (t) t.onended = () => { if (local.video === t) { toast('Камера отключилась'); local.video = null; refreshOutgoing(); } };
  refreshOutgoing();
}
async function initMedia() {
  if (!navigator.mediaDevices?.getUserMedia) {
    setHint(location.protocol !== 'https:' && location.hostname !== 'localhost'
      ? 'Камера и микрофон работают только по HTTPS. Откройте сайт через https://' : 'Браузер не поддерживает видеозвонки', true);
    return;
  }
  try {
    const s = await gUM({ audio: aC(), video: camOn ? vC() : false });
    setAudio(s.getAudioTracks()[0] || null); setVideo(s.getVideoTracks()[0] || null);
  } catch {
    setAudio(await acquire('audio'));
    if (camOn) setVideo(await acquire('video'));
  }
  await fillDevices();
}
async function reacquire(kind) {
  if (kind === 'audio') { local.audio?.stop(); setAudio(await acquire('audio')); }
  else { local.video?.stop(); local.video = null; if (camOn) setVideo(await acquire('video')); else refreshOutgoing(); }
}

async function fillDevices() {
  const list = await navigator.mediaDevices.enumerateDevices();
  const fill = (sel, kind, cur, none) => {
    const devs = list.filter(d => d.kind === kind);
    sel.innerHTML = devs.length ? '' : `<option value="">${none}</option>`;
    devs.forEach((d, i) => sel.add(new Option(d.label || `${none.replace('Нет ', '')} ${i + 1}`, d.deviceId)));
    if (cur && devs.some(d => d.deviceId === cur)) sel.value = cur;
  };
  fill($('#sCam'), 'videoinput', local.video?.getSettings().deviceId || S.cam, 'Нет камеры');
  fill($('#sMic'), 'audioinput', local.audio?.getSettings().deviceId || S.mic, 'Нет микрофона');
  fill($('#sSpk'), 'audiooutput', S.spk, 'По умолчанию');
}
navigator.mediaDevices?.addEventListener?.('devicechange', fillDevices);

// ---------- уровень звука / говорящий ----------
const meters = new Map(); // key -> {an, buf, cb}
function addMeter(key, track, cb) {
  removeMeter(key); if (!track) return;
  try {
    const src = ac().createMediaStreamSource(new MediaStream([track]));
    const an = ac().createAnalyser(); an.fftSize = 512; src.connect(an);
    meters.set(key, { an, src, buf: new Uint8Array(an.fftSize), cb });
  } catch {}
}
function removeMeter(key) { const m = meters.get(key); if (m) { try { m.src.disconnect(); } catch {} meters.delete(key); } }
setInterval(() => {
  for (const m of meters.values()) {
    m.an.getByteTimeDomainData(m.buf);
    let s = 0; for (const v of m.buf) { const x = (v - 128) / 128; s += x * x; }
    m.cb(Math.min(1, Math.sqrt(s / m.buf.length) * 4));
  }
}, 90);
function setupSelfMeter() {
  addMeter('self', local.audio, lvl => {
    const v = micOn ? lvl : 0;
    $('#pvMeter').style.width = $('#sMeter').style.width = (v * 100) + '%';
    selfTile?.el.classList.toggle('speaking', v > .12);
  });
}

// ---------- исходящие треки ----------
const outVideo = () => screen ? screen.getVideoTracks()[0] : local.video;
const outAudio = () => mix ? mix.track : local.audio;
function buildMix() {
  mix?.nodes.forEach(n => { try { n.disconnect(); } catch {} }); mix = null;
  const sa = screen?.getAudioTracks()[0]; if (!sa) return;
  const dest = ac().createMediaStreamDestination(), nodes = [];
  for (const t of [local.audio, sa]) if (t) { const n = ac().createMediaStreamSource(new MediaStream([t])); n.connect(dest); nodes.push(n); }
  mix = { track: dest.stream.getAudioTracks()[0], nodes };
}
function attachLocal(p) {
  for (const t of p.pc.getTransceivers()) {
    if (t.stopped || t.currentDirection === 'stopped') continue;
    const kind = t.receiver.track.kind;
    if (t.direction !== 'sendrecv') t.direction = 'sendrecv';
    t.sender.replaceTrack(kind === 'video' ? outVideo() || null : outAudio() || null).catch(() => {});
  }
}
function refreshOutgoing() {
  peers.forEach(attachLocal); tuneSenders();
  renderSelf(); renderButtons(); sendState();
}
function renderSelf() {
  const vt = outVideo();
  for (const [v, tile] of [[$('#pv'), $('#pvTile')], [$('#sPrev'), null], selfTile ? [selfTile.video, selfTile.el] : [null, null]]) {
    if (!v) continue;
    const cur = v.srcObject?.getVideoTracks()[0];
    if (cur !== vt) v.srcObject = vt ? new MediaStream([vt]) : null;
    if (tile) {
      tile.classList.toggle('novideo', !vt);
      tile.classList.toggle('mirror', !!vt && !screen && S.mirror);
      tile.classList.toggle('screen', !!screen);
      tile.classList.toggle('micoff', !micOn);
    }
  }
  const nm = ($('#name').value.trim() || S.name || '?');
  $('#pvAv').textContent = nm[0].toUpperCase(); $('#pvAv').style.background = `hsl(${hue(nm)} 55% 45%)`;
  if (selfTile) selfTile.el.classList.toggle('hand', hand);
}
function renderButtons() {
  for (const b of ['#lMic', '#bMic']) { $(b).innerHTML = micOn ? IC.mic : IC.micOff; $(b).classList.toggle('off', !micOn); }
  for (const b of ['#lCam', '#bCam']) { $(b).innerHTML = camOn ? IC.cam : IC.camOff; $(b).classList.toggle('off', !camOn); }
  $('#bScreen').classList.toggle('on', !!screen);
  $('#bHand').classList.toggle('on', hand);
}

// ---------- кнопки ----------
function toggleMic() { micOn = !micOn; if (local.audio) local.audio.enabled = micOn; refreshOutgoing(); }
async function toggleCam() {
  camOn = !camOn;
  if (!camOn) { local.video?.stop(); local.video = null; refreshOutgoing(); }
  else { renderButtons(); setVideo(await acquire('video')); if (!local.video) { camOn = false; renderButtons(); } }
}
async function toggleScreen() {
  if (screen) return stopScreen();
  if (!navigator.mediaDevices.getDisplayMedia) return toast('Ваш браузер не поддерживает демонстрацию экрана');
  try {
    const s = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: { ideal: S.scr === 'motion' ? 30 : 15 } }, audio: true });
    screen = s;
    const vt = s.getVideoTracks()[0]; vt.contentHint = S.scr; vt.onended = stopScreen;
    buildMix(); refreshOutgoing();
    toast(s.getAudioTracks().length ? 'Демонстрация со звуком включена' : 'Демонстрация экрана включена');
  } catch (e) { if (e.name !== 'NotAllowedError') toast('Не удалось начать демонстрацию: ' + e.name); }
}
function stopScreen() {
  if (!screen) return;
  screen.getTracks().forEach(t => t.stop()); screen = null; buildMix(); refreshOutgoing();
}
function toggleHand() { hand = !hand; refreshOutgoing(); }

// ---------- плитки ----------
function goFull(el) {
  const v = el.querySelector('video');
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  if (req) { const r = req.call(el); if (r?.catch) r.catch(() => v?.webkitEnterFullscreen?.()); }
  else v?.webkitEnterFullscreen?.();   // iPhone Safari
}
function makeTile(id, name) {
  const el = document.createElement('div');
  el.className = 'tile novideo';
  el.innerHTML = `<video autoplay playsinline></video><div class="avatar"><b></b></div><div class="st"></div><div class="hand">✋</div>
    <div class="label"><span class="mo">${IC.micOff}</span><span class="nm"></span></div><button class="fs" title="На весь экран">${IC.full}</button>`;
  const t = { el, video: el.querySelector('video') };
  setTileName(t, name);
  el.querySelector('.fs').onclick = e => { e.stopPropagation(); goFull(el); };
  el.onclick = () => pin(pinned === el ? null : el);
  el.ondblclick = () => goFull(el);
  $('#grid').append(el); layout();
  return t;
}
function setTileName(t, name) {
  t.el.querySelector('.nm').textContent = name;
  const b = t.el.querySelector('.avatar b'); b.textContent = (name[0] || '?').toUpperCase(); b.style.background = `hsl(${hue(name)} 55% 45%)`;
}
function pin(el) {
  pinned?.classList.remove('pinned'); pinned = el; el?.classList.add('pinned');
  $('#grid').classList.toggle('focus', !!el); layout();
}
function layout() {
  const g = $('#grid'), n = g.children.length, GAP = 10;
  const W = g.clientWidth - 24, H = g.clientHeight - 24;
  const mobile = innerWidth <= 700 || innerHeight <= 500;
  g.style.setProperty('--gh', g.clientHeight + 'px');
  document.documentElement.style.setProperty('--fh', ($('footer')?.offsetHeight || 70) + 'px');
  g.classList.toggle('duo', mobile && n === 2 && !pinned);
  // пропорции плитки: на телефоне в портрете — вертикальные, иначе 16:9
  const portrait = mobile && H > W;
  const r = portrait ? (n === 1 ? W / H : 3 / 4) : 16 / 9;
  let bw = 100, bh = 100;
  for (let cols = 1; cols <= n; cols++) {
    const rows = Math.ceil(n / cols);
    const tw = Math.min((W - GAP * (cols - 1)) / cols, ((H - GAP * (rows - 1)) / rows) * r);
    if (tw > bw) { bw = tw; bh = tw / r; }
  }
  g.style.setProperty('--tw', Math.floor(bw) + 'px');
  g.style.setProperty('--th', Math.floor(bh) + 'px');
  $('#count').textContent = `${n} ${n % 10 === 1 && n % 100 !== 11 ? 'участник' : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? 'участника' : 'участников'}`;
}
addEventListener('resize', layout);
function applySink(v) { if (S.spk && v.setSinkId) v.setSinkId(S.spk).catch(() => {}); }

// ---------- WebRTC (perfect negotiation, mesh) ----------
function createPeer(id, name, state, initiator) {
  if (peers.has(id)) return peers.get(id);
  const pc = new RTCPeerConnection({ iceServers });
  const tile = makeTile(id, name);
  const p = { id, name, pc, tile, state: state || {}, polite: me > id, makingOffer: false, ignoreOffer: false, stream: new MediaStream(), q: Promise.resolve() };
  peers.set(id, p);
  tile.video.srcObject = p.stream; applySink(tile.video);
  tile.el.querySelector('.st').textContent = 'Подключение…';
  applyState(p);

  pc.ontrack = e => {
    p.stream.getTracks().filter(t => t.kind === e.track.kind).forEach(t => p.stream.removeTrack(t));
    p.stream.addTrack(e.track);
    tile.video.srcObject = p.stream; tile.video.play().catch(() => {});
    if (e.track.kind === 'audio') addMeter(id, e.track, l => tile.el.classList.toggle('speaking', l > .1 && p.state.mic !== false));
    if (e.track.kind === 'video') { e.track.onmute = () => applyState(p); e.track.onunmute = () => applyState(p); }
  };
  pc.onicecandidate = e => { if (e.candidate) send('signal', { candidate: e.candidate }, id); };
  pc.onnegotiationneeded = async () => {
    try { p.makingOffer = true; await pc.setLocalDescription(); send('signal', { description: pc.localDescription }, id); }
    catch (e) { console.warn(e); } finally { p.makingOffer = false; }
  };
  pc.onconnectionstatechange = () => {
    const s = pc.connectionState;
    tile.el.querySelector('.st').textContent = s === 'connected' ? '' : s === 'failed' ? 'Нет связи — переподключаю…' : s === 'disconnected' ? 'Связь прервалась…' : 'Подключение…';
    if (s === 'failed') pc.restartIce();
    if (s === 'connected') tuneSenders();
  };
  if (initiator) {
    pc.addTransceiver('audio', { direction: 'sendrecv' });
    pc.addTransceiver('video', { direction: 'sendrecv' });
    attachLocal(p);
  }
  return p;
}
function onSignal({ from, data }) {
  const p = peers.get(from) || createPeer(from, 'Гость', {}, false);
  p.q = p.q.then(async () => {
    const pc = p.pc;
    try {
      if (data.description) {
        const d = data.description;
        const collision = d.type === 'offer' && (p.makingOffer || pc.signalingState !== 'stable');
        p.ignoreOffer = !p.polite && collision;
        if (p.ignoreOffer) return;
        await pc.setRemoteDescription(d);
        if (d.type === 'offer') {
          attachLocal(p);
          await pc.setLocalDescription();
          send('signal', { description: pc.localDescription }, from);
        }
      } else if (data.candidate) {
        try { await pc.addIceCandidate(data.candidate); } catch (e) { if (!p.ignoreOffer) console.warn(e); }
      }
    } catch (e) { console.warn('signal error', e); }
  });
}
function applyState(p) {
  const s = p.state, vt = p.stream.getVideoTracks()[0];
  p.tile.el.classList.toggle('micoff', s.mic === false);
  p.tile.el.classList.toggle('novideo', !(s.cam || s.screen) || !vt || vt.muted);
  p.tile.el.classList.toggle('screen', !!s.screen);
  p.tile.el.classList.toggle('hand', !!s.hand);
}
function removePeer(id) {
  const p = peers.get(id); if (!p) return;
  p.pc.close(); removeMeter(id);
  if (pinned === p.tile.el) pin(null);
  p.tile.el.remove(); peers.delete(id); layout(); tuneSenders();
}

// ---------- сигнализация ----------
// Все исходящие сообщения идут через одну очередь: порядок сохраняется (ICE-кандидаты не обгоняют offer),
// а накопившиеся отправляются одной пачкой — меньше запросов и задержек.
const outbox = [];
let flushing = false, resume = null, lastSeen = 0;
const sleep = ms => new Promise(r => setTimeout(r, ms));
function send(type, data, to) {
  if (!token) return;
  outbox.push({ type, data, to });
  if (!flushing) flush();
}
async function flush() {
  flushing = true;
  let fails = 0;
  while (outbox.length && token) {
    const batch = outbox.slice(0, 100), tok = token;
    try {
      const r = await fetch('/send', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: tok, batch }) });
      if (r.status === 429) { await sleep(400); continue; }
      outbox.splice(0, batch.length); fails = 0;
    } catch {
      if (++fails > 4 || tok !== token) { outbox.length = 0; break; }
      await sleep(300 * fails);
    }
  }
  flushing = false;
}
function sendState() { if (inCall) send('state', { mic: micOn && !!local.audio, cam: camOn && !!local.video, screen: !!screen, hand }); }

// Чем больше людей — тем ниже битрейт на каждого: в mesh-схеме это главное средство от лагов
function tuneSenders() {
  const n = peers.size;
  const kbps = screen ? (n <= 1 ? 2500 : n <= 3 ? 1500 : 900) : (n <= 1 ? 1500 : n <= 3 ? 900 : n <= 5 ? 550 : 400);
  const scale = !screen && n >= 4 ? 1.5 : 1;
  peers.forEach(p => {
    for (const t of p.pc.getTransceivers()) {
      if (t.receiver.track.kind !== 'video' || t.currentDirection === 'stopped') continue;
      const prm = t.sender.getParameters();
      if (!prm.encodings || !prm.encodings.length) continue;
      const e = prm.encodings[0];
      if (e.maxBitrate === kbps * 1000 && (e.scaleResolutionDownBy || 1) === scale) continue;
      e.maxBitrate = kbps * 1000; e.scaleResolutionDownBy = scale;
      t.sender.setParameters(prm).catch(() => {});
    }
  });
}

function connect() {
  const name = S.name || 'Гость';
  const rq = resume ? `&rid=${encodeURIComponent(resume.rid)}&rkey=${encodeURIComponent(resume.rkey)}` : '';
  es = new EventSource(`/events?room=${encodeURIComponent(roomName)}&name=${encodeURIComponent(name)}${rq}`);
  lastSeen = Date.now();
  const on = (ev, fn) => es.addEventListener(ev, e => { lastSeen = Date.now(); try { fn(e.data ? JSON.parse(e.data) : null); } catch (err) { console.error(ev, err); } });
  on('hello', d => {
    me = d.id; token = d.token; iceServers = d.iceServers; resume = null;
    $('#msgs').innerHTML = ''; d.history.forEach(m => addMsg(m, true));
    d.peers.forEach(p => createPeer(p.id, p.name, p.state, true));
    setGame(d.game, true);
    sendState();
  });
  on('ping', () => {});
  on('join', d => { createPeer(d.id, d.name, d.state, false); sysMsg(`${d.name} подключился(-ась)`); });
  on('leave', d => { const p = peers.get(d.id); if (p) sysMsg(`${p.name} вышел(-ла)`); removePeer(d.id); });
  on('signal', d => onSignal(d));
  on('chat', d => addMsg(d));
  on('state', d => {
    const p = peers.get(d.id); if (!p) return;
    if (d.state.hand && !p.state.hand) toast(`${p.name} поднимает руку ✋`);
    if (d.state.screen && !p.state.screen) { toast(`${p.name} показывает экран`); pin(p.tile.el); }
    if (!d.state.screen && p.state.screen && pinned === p.tile.el) pin(null);
    p.state = d.state; applyState(p);
  });
  on('game', d => setGame(d));
  on('game-error', d => toast('🎮 ' + d.message));
  on('full', d => { leaving = true; es.close(); alert(`Комната заполнена (максимум ${d.max})`); location.href = location.pathname; });
  es.onerror = () => reconnect();
}
function reconnect() {
  if (leaving || !inCall) return;
  es?.close();
  if (me && token) resume = { rid: me, rkey: token };   // вернёмся тем же участником — место в игре сохранится
  token = null; outbox.length = 0;
  [...peers.keys()].forEach(removePeer);
  toast('Связь с сервером потеряна, переподключаюсь…');
  clearTimeout(reconnect.t);
  reconnect.t = setTimeout(() => inCall && connect(), 1500);
}
// Сторож: если сервер молчит дольше 40 с (пульс раз в 15 с) — соединение «зависло», переподключаемся
setInterval(() => { if (inCall && token && Date.now() - lastSeen > 40000) reconnect(); }, 5000);
// Вернулись на вкладку/разблокировали телефон — сразу проверяем связь
document.addEventListener('visibilitychange', () => { if (!document.hidden && inCall && token && Date.now() - lastSeen > 20000) reconnect(); });
addEventListener('online', () => { if (inCall && Date.now() - lastSeen > 5000) reconnect(); });

// ---------- чат ----------
function linkify(el, text) {
  const re = /(https?:\/\/[^\s<]+)/g; let last = 0, m;
  while ((m = re.exec(text))) {
    el.append(text.slice(last, m.index));
    const a = document.createElement('a'); a.href = m[1]; a.textContent = m[1]; a.target = '_blank'; a.rel = 'noopener noreferrer'; el.append(a);
    last = m.index + m[1].length;
  }
  el.append(text.slice(last));
}
function addMsg(m, silent) {
  const mine = m.id === me;
  const d = document.createElement('div'); d.className = 'msg' + (mine ? ' me' : '');
  const who = document.createElement('div'); who.className = 'who';
  who.textContent = `${mine ? 'Вы' : m.name} · ${new Date(m.ts).toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' })}`;
  const b = document.createElement('div'); b.className = 'bub'; linkify(b, m.text);
  d.append(who, b); $('#msgs').append(d); $('#msgs').scrollTop = 1e9;
  if (!mine && !silent && $('#chat').classList.contains('hidden')) {
    unread++; $('#unread').textContent = unread; $('#unread').classList.remove('hidden');
    toast(`💬 ${m.name}: ${m.text.length > 70 ? m.text.slice(0, 70).trimEnd() + '…' : m.text}`);
  }
}
function sysMsg(t) { const d = document.createElement('div'); d.className = 'sys'; d.textContent = t; $('#msgs').append(d); $('#msgs').scrollTop = 1e9; }
function toggleChat(force) {
  const open = force ?? $('#chat').classList.contains('hidden');
  $('#chat').classList.toggle('hidden', !open);
  $('#bChat').classList.toggle('on', open);
  if (open && isNarrow()) toggleGames(false);
  if (open) { unread = 0; $('#unread').classList.add('hidden'); $('#chatInput').focus(); }
  setTimeout(layout, 0);
}
$('#chatForm').onsubmit = e => {
  e.preventDefault(); const t = $('#chatInput').value.trim(); if (!t) return;
  send('chat', { text: t }); $('#chatInput').value = '';
};


// ---------- игры ----------
let gameView = null, selCard = null, gameTimerIv = null;
const isNarrow = () => innerWidth <= 700 || innerHeight <= 500;
const SUIT = { S: '♠', C: '♣', D: '♦', H: '♥' };
const RANK = { 11: 'В', 12: 'Д', 13: 'К', 14: 'Т' };
const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const cardHTML = (c, cls = '', act = '') => {
  const s = c[0], r = +c.slice(1), red = s === 'H' || s === 'D', lab = (RANK[r] || r) + SUIT[s];
  return `<div class="card ${red ? 'red' : ''} ${cls}" ${act ? `data-act="${act}"` : ''}><span>${lab}</span><span class="c">${SUIT[s]}</span><span class="r2">${lab}</span></div>`;
};
const gsend = (op, extra = {}) => send('game', { op, ...extra });

function toggleGames(force) {
  const open = force ?? $('#games').classList.contains('hidden');
  $('#games').classList.toggle('hidden', !open);
  $('#bGames').classList.toggle('on', open);
  if (open) { $('#gbadge').classList.add('hidden'); if (isNarrow()) toggleChat(false); renderGame(); }
  setTimeout(layout, 0);
}

function setGame(v, initial) {
  const prev = gameView;
  gameView = v;
  if (!v) { selCard = null; }
  const closed = $('#games').classList.contains('hidden');
  if (v && !initial && closed) {
    const host = v.players.find(p => p.id === v.host);
    if ((!prev || prev.type !== v.type || prev.status === 'over') && v.status === 'lobby' && v.host !== me) toast(`🎮 ${host ? host.name : 'Кто-то'} зовёт играть: ${v.title}`);
    if (v.status === 'playing' && prev?.status !== 'playing' && v.players.some(p => p.id === me)) { toggleGames(true); return; }
    $('#gbadge').classList.remove('hidden');
  }
  if (!v && prev && prev.status !== 'over') toast('🎮 Игра закрыта');
  scheduleRender();
}
let renderQueued = false;
function scheduleRender() {           // не перерисовываем чаще одного раза за кадр
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; renderGame(); });
}

function renderGame() {
  const body = $('#gameBody');
  clearInterval(gameTimerIv);
  if ($('#games').classList.contains('hidden')) return;
  const g = gameView;
  $('#gamesTitle').textContent = g ? g.title : 'Игры';
  if (!g) {
    body.innerHTML = `<div class="gl">
      <button class="gcard" data-act="create:durak"><span class="ico">🃏</span><span><b>Дурак</b><small>Подкидной, 36 карт · 2–6 игроков</small></span></button>
      <button class="gcard" data-act="create:spy"><span class="ico">🕵️</span><span><b>Шпион</b><small>Вычислите шпиона, не выдав локацию · 3–8 игроков</small></span></button>
      <button class="gcard" data-act="create:ttt"><span class="ico">⭕</span><span><b>Крестики-нолики</b><small>3×3 · 2 игрока</small></span></button>
    </div><p class="glog">Выберите игру — остальные участники звонка получат приглашение.</p>`;
    return;
  }
  const inGame = g.players.some(p => p.id === me), isHost = g.host === me;
  if (g.status === 'lobby') {
    body.innerHTML = `<div class="gstatus">Ждём игроков <span class="tm">${g.players.length}/${g.max}</span></div>
      <div class="plist">${g.players.map(p => `<div><span>${esc(p.name)}${p.id === me ? ' (вы)' : ''}</span><span>${p.id === g.host ? '👑' : ''}</span></div>`).join('')}</div>
      <div class="gbtns">
        ${inGame ? `<button class="gbtn sec" data-act="leave">Выйти</button>` : `<button class="gbtn" data-act="join" ${g.players.length >= g.max ? 'disabled' : ''}>Играть</button>`}
        ${isHost ? `<button class="gbtn" data-act="start" ${g.players.length < g.min ? 'disabled' : ''}>Начать${g.players.length < g.min ? ` (нужно ${g.min})` : ''}</button>` : ''}
      </div>
      ${isHost ? `<div class="gbtns"><button class="gbtn sec" data-act="close">Отменить игру</button></div>` : ''}
      <p class="glog">${isHost ? 'Когда все присоединятся — нажмите «Начать».' : 'Нажмите «Играть», чтобы участвовать.'}</p>`;
    return;
  }
  if (g.type === 'durak') renderDurak(g, body); else if (g.type === 'spy') renderSpy(g, body); else renderTTT(g, body);
  const after = g.status === 'over'
    ? `<div class="gbtns">${isHost ? `<button class="gbtn" data-act="start">Ещё партию</button>` : ''}<button class="gbtn sec" data-act="close">${isHost || !g.host ? 'Закрыть игру' : 'Закрыть'}</button></div>`
    : (isHost ? `<div class="gbtns"><button class="gbtn sec" data-act="close">Прервать партию</button></div>` : '');
  body.insertAdjacentHTML('beforeend', after);
  const st = g.state;
  if (st && !st.over && st.deadline) {
    const tick = () => { const el = body.querySelector('.tm[data-dl]'); if (!el) return; const sec = Math.max(0, Math.ceil((st.deadline - Date.now()) / 1000)); el.textContent = '⏱ ' + (sec >= 60 ? `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}` : sec); el.classList.toggle('low', sec <= 10); };
    tick(); gameTimerIv = setInterval(tick, 1000);
  }
}

function renderDurak(g, body) {
  const s = g.state, L = s.legal, nm = id => esc(s.players.find(p => p.id === id)?.name || '?');
  if (selCard && !(L && L.defend[selCard])) selCard = null;
  let msg, mine = false;
  if (s.over) msg = g.aborted ? `Партия прервана: ${esc(g.aborted)} вышел(-ла)` : s.loser ? (s.loser === me ? 'Вы — дурак 🤡' : `Дурак — ${nm(s.loser)} 🤡`) : 'Ничья 🤝';
  else if (!L) msg = `Ходит ${nm(s.attacker)}, отбивается ${nm(s.defender)}`;
  else if (s.defender === me) { mine = !s.taking; msg = s.taking ? 'Вы берёте — ждём, подкинут ли ещё' : selCard ? 'Выберите карту на столе, которую бьёте' : 'Отбивайтесь или берите'; }
  else if (!s.table.length && L.attack.length) { mine = true; msg = 'Ваш ход — выберите карту'; }
  else if (L.pass) { mine = true; msg = L.attack.length ? 'Подкиньте или нажмите «' + (s.table.every(t => t.d) ? 'Бито' : 'Пас') + '»' : 'Подкинуть нечего'; }
  else msg = `Ходит ${nm(s.attacker)}, отбивается ${nm(s.defender)}`;
  const opp = s.players.filter(p => p.id !== me).map(p => `<div class="opp ${p.id === s.attacker ? 'att' : ''} ${p.id === s.defender ? 'def' : ''} ${p.out ? 'out' : ''}">
      <div>${esc(p.name)}</div><div class="cnt">${p.out ? '✅ вышел' : `🂠 ${p.count}`}${p.id === s.defender && !p.out ? ' · 🛡' : p.id === s.attacker && !p.out ? ' · ⚔️' : ''}${s.passed.includes(p.id) ? ' · пас' : ''}</div></div>`).join('');
  const targets = selCard ? L.defend[selCard] : [];
  const table = s.table.map((t, i) => `<div class="pair ${targets.includes(i) ? 'target' : ''}" ${targets.includes(i) ? `data-act="target:${i}"` : ''}>${cardHTML(t.a)}${t.d ? cardHTML(t.d, 'd') : ''}</div>`).join('');
  const deck = s.deck ? `<div class="deckbox">${cardHTML(s.trumpCard, 'trumpc')}<div class="card back"></div><div class="n">${s.deck} · козырь ${SUIT[s.trump]}</div></div>`
    : `<div class="deckbox" title="Козырь">${cardHTML(s.trumpCard)}<div class="n">козырь ${SUIT[s.trump]}</div></div>`;
  const hand = s.hand || [];
  const playable = c => L && (L.attack.includes(c) || L.defend[c]);
  const handHTML = hand.map(c => cardHTML(c, c === selCard ? 'sel' : playable(c) ? 'ok' : (L && (mine || s.defender === me) ? 'no' : ''), `card:${c}`)).join('');
  const acts = [];
  if (L?.take) acts.push(`<button class="gbtn warn" data-act="take">Взять</button>`);
  if (L?.pass) acts.push(`<button class="gbtn sec" data-act="pass">${s.table.every(t => t.d) ? 'Бито' : 'Пас'}</button>`);
  body.innerHTML = `
    <div class="gstatus ${mine ? 'my' : ''}"><span>${msg}</span>${!s.over ? `<span class="tm" data-dl></span>` : ''}</div>
    <div class="opps">${opp}</div>
    <div class="board">${deck}<div class="tbl">${table || '<span class="glog" style="color:#cfe">Стол пуст</span>'}</div></div>
    <div class="glog">${s.log.map(esc).join(' · ')}</div>
    ${acts.length ? `<div class="gbtns">${acts.join('')}</div>` : ''}
    ${s.hand ? `<div class="hand" id="hand">${handHTML}</div>` : '<p class="glog">Вы смотрите партию как зритель</p>'}`;
  fitHand();
}
// Подгоняем веер карт по ширине панели, чтобы 6–20 карт помещались без прокрутки
function fitHand() {
  const h = $('#hand'); if (!h) return;
  const n = h.children.length; if (!n) return;
  const W = h.clientWidth - 8, w = Math.min(64, Math.max(44, W / 6.2));
  h.style.setProperty('--w', w + 'px');
  const ov = n > 1 ? Math.min(6, (W - n * w) / (n - 1)) : 0;
  h.style.setProperty('--ov', Math.max(-w * 0.72, ov) + 'px');
}
addEventListener('resize', () => gameView && scheduleRender());

function renderTTT(g, body) {
  const s = g.state, L = s.legal;
  const pl = id => s.players.find(p => p.id === id);

  if (s.over) msg = g.aborted ? `Партия прервана: ${esc(g.aborted)} вышел(-ла)` : s.draw ? 'Ничья 🤝' : s.winner === me ? (s.forfeit ? 'Победа — соперник не успел 🏆' : 'Вы победили 🏆') : `Победил(-а) ${esc(pl(s.winner)?.name)}${s.forfeit ? ' (время вышло)' : ''}`;
  else if (s.turn === me) { mine = true; msg = `Ваш ход (${pl(me).mark === 'X' ? '✕' : '◯'})`; }
  else msg = `Ходит ${esc(pl(s.turn)?.name)}`;

    const can = L && L.place.includes(i);
    return `<button class="${v || ''} ${can ? 'can' : ''} ${s.line?.includes(i) ? 'win' : ''}" ${can ? `data-act="cell:${i}"` : 'disabled'}>${v === 'X' ? '✕' : v === 'O' ? '◯' : ''}</button>`;
  }).join('');
  body.innerHTML = `<div class="gstatus ${mine ? 'my' : ''}"><span>${msg}</span>${!s.over ? `<span class="tm" data-dl></span>` : ''}</div>
    <div class="opps">${s.players.map(p => `<div class="opp ${p.id === s.turn && !s.over ? 'att' : ''}">${esc(p.name)}${p.id === me ? ' (вы)' : ''}<div class="cnt">${p.mark === 'X' ? '✕' : '◯'}</div></div>`).join('')}</div>
    <div class="ttt">${cells}</div>`;
}


// ---------- Шпион ----------
let spyLocOpen = false, spyHidden = false, spyGuess = false, spyPick = null, spySure = null, spyGameKey = '';
const spyCross = new Set();
function renderSpy(g, body) {
  const s = g.state, L = s.legal, nm = id => esc(s.players.find(p => p.id === id)?.name || '?');
  const key = s.first + s.endsAt;                    // новая партия — сбрасываем локальные пометки
  if (key !== spyGameKey) { spyGameKey = key; spyCross.clear(); spyHidden = false; spyGuess = false; spyPick = null; spySure = null; }
  if (!L?.guess) { spyGuess = false; spyPick = null; }
  const acc = s.accusation;
  let msg, mine = false;
  if (s.over) msg = g.aborted ? `Партия прервана: ${esc(g.aborted)} вышел(-ла)` : 'Партия окончена';
  else if (acc) { msg = `Голосование: ${acc.yes} из ${acc.need}`; mine = !!L?.vote; }
  else if (s.phase === 'final') { msg = L?.final.length ? 'Время вышло! Кто шпион?' : 'Ждём голоса остальных'; mine = !!L?.final.length; }
  else msg = 'Задавайте вопросы друг другу';

  let card = '';
  if (s.me && !s.over) {
    card = spyHidden
      ? `<div class="spycard hid" data-act="spyhide"><div class="big">🙈</div><small>Карточка скрыта — нажмите, чтобы показать</small></div>`
      : s.me.spy
        ? `<div class="spycard spy" data-act="spyhide"><small>Ваша роль</small><div class="big">🕵️ Вы — шпион</div><small>Слушайте ответы и вычислите локацию. Назвать её можно в любой момент. Нажмите, чтобы скрыть</small></div>`
        : `<div class="spycard" data-act="spyhide"><small>Локация</small><div class="big">📍 ${esc(s.me.location)}</div><small>Ваша роль: <b>${esc(s.me.role)}</b> · нажмите, чтобы скрыть</small></div>`;
  } else if (!s.me && !s.over) card = '<p class="glog">Вы смотрите партию как зритель</p>';

  let accHTML = '';
  if (acc && !s.over) {
    accHTML = `<div class="acc"><div><b>${nm(acc.by)}</b> обвиняет <b>${nm(acc.target)}</b>. ${acc.target === me ? 'Вас обвиняют — ждём голосования…' : 'Это шпион?'}</div>
      <div class="glog" style="text-align:left">Нужно единогласно: ${acc.yes}/${acc.need} «за». Одно «против» — обвинение снимается.</div>
      ${L?.vote ? `<div class="gbtns"><button class="gbtn" data-act="spyvote:1">Да, шпион</button><button class="gbtn sec" data-act="spyvote:0">Нет</button></div>` : ''}</div>`;
  }

  const rows = s.players.map(p => {
    let btn = '';
    if (L?.final.includes(p.id)) btn = `<button class="sb vote" data-act="spyfinal:${p.id}">Это шпион</button>`;
    else if (L?.accuse.includes(p.id)) btn = spySure === p.id
      ? `<button class="sb sure" data-act="spyaccuse:${p.id}">Точно? Обвинить</button>`
      : `<button class="sb" data-act="spyask:${p.id}">Обвинить</button>`;
    const tags = [];
    if (s.over) { if (p.spy) tags.push('🕵️ шпион'); else if (p.role) tags.push(esc(p.role)); }
    else {
      if (p.id === s.first && s.phase === 'play') tags.push('спрашивает первым');
      if (p.accused) tags.push('уже обвинял');
      if (s.phase === 'final' && p.votedFinal) tags.push('✓ проголосовал');
    }
    return `<div class="prow"><span class="nm2">${esc(p.name)}${p.id === me ? ' (вы)' : ''}</span><span class="tag">${tags.join(' · ')}</span>${btn}</div>`;
  }).join('');

  const locBtns = s.locations.map(l => `<button class="${spyCross.has(l) ? 'x' : ''} ${spyPick === l ? 'pick' : ''} ${s.over && l === s.location ? 'pick' : ''}" data-act="spyloc:${esc(l)}">${esc(l)}</button>`).join('');
  let guessHTML = '';
  if (L?.guess) {
    guessHTML = spyGuess
      ? `<div class="acc"><div><b>Назовите локацию</b> — угадаете, вы победили; ошибётесь — проиграли.</div><div class="locs">${locBtns}</div>
         <div class="gbtns"><button class="gbtn" data-act="spyconfirm" ${spyPick ? '' : 'disabled'}>${spyPick ? 'Это ' + esc(spyPick) + '!' : 'Выберите локацию'}</button><button class="gbtn sec" data-act="spyguess">Отмена</button></div></div>`
      : `<div class="gbtns"><button class="gbtn warn" data-act="spyguess">🕵️ Я знаю локацию!</button></div>`;
  }
  const result = s.over && !g.aborted ? `<div class="gres">${s.winner === 'spy' ? '🕵️ Шпион победил' : '🎉 Мирные победили'}</div><p class="glog" style="font-size:14px">${esc(s.reason)}<br>Локация: <b>${esc(s.location)}</b></p>` : '';
  body.innerHTML = `
    <div class="gstatus ${mine ? 'my' : ''}"><span>${msg}</span>${!s.over ? `<span class="tm" data-dl></span>` : ''}</div>
    ${result}${card}${accHTML}${guessHTML}
    <div class="plist">${rows}</div>
    <div class="glog">${s.log.map(esc).join(' · ')}</div>
    ${spyGuess ? '' : `<details class="lc" ${s.over || spyLocOpen ? 'open' : ''}><summary>Все локации (${s.locations.length}) — нажмите, чтобы вычеркнуть</summary><div class="locs">${locBtns}</div></details>`}`;
}
function spyClick(act, arg) {
  switch (act) {
    case 'spyhide': spyHidden = !spyHidden; break;
    case 'spyask': spySure = arg; setTimeout(() => { if (spySure === arg) { spySure = null; scheduleRender(); } }, 4000); break;
    case 'spyaccuse': spySure = null; gsend('move', { move: { t: 'accuse', target: arg } }); break;
    case 'spyvote': gsend('move', { move: { t: 'vote', yes: arg === '1' } }); break;
    case 'spyfinal': gsend('move', { move: { t: 'final', target: arg } }); break;
    case 'spyguess': spyGuess = !spyGuess; spyPick = null; break;
    case 'spyloc': if (spyGuess) spyPick = arg; else spyCross.has(arg) ? spyCross.delete(arg) : spyCross.add(arg); break;
    case 'spyconfirm': if (spyPick) { gsend('move', { move: { t: 'guess', location: spyPick } }); spyGuess = false; } break;
    default: return false;
  }
  scheduleRender();
  return true;
}

// Один обработчик на всю панель: быстрые нажатия без лишних подписок
$('#gameBody').addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const [act, arg] = el.dataset.act.split(/:(.*)/s);
  const g = gameView, L = g?.state?.legal;
  if (act.startsWith('spy')) {
    // details/summary не должен сворачиваться при клике по локации
    if (act === 'spyloc') e.preventDefault();
    spyClick(act, arg && act === 'spyloc' ? el.textContent : arg);
    return;
  }
  switch (act) {
    case 'create': gsend('create', { game: arg }); break;
    case 'join': case 'leave': case 'start': case 'close': gsend(act); break;
    case 'take': case 'pass': gsend('move', { move: { t: act } }); break;
    case 'cell': gsend('move', { move: { t: 'place', i: +arg } }); break;
    case 'card': {
      if (!L) return;
      if (L.attack.includes(arg)) { gsend('move', { move: { t: 'attack', card: arg } }); break; }
      const t = L.defend[arg];
      if (!t) { toast(g.state.defender === me ? 'Этой картой не побить' : 'Этой картой сейчас нельзя ходить'); break; }
      if (t.length === 1) { selCard = null; gsend('move', { move: { t: 'defend', card: arg, idx: t[0] } }); }
      else { selCard = selCard === arg ? null : arg; renderGame(); }
      break;
    }
    case 'target': if (selCard) { gsend('move', { move: { t: 'defend', card: selCard, idx: +arg } }); selCard = null; } break;
  }
});
$('#gameBody').addEventListener('toggle', e => { if (e.target.matches('details.lc')) spyLocOpen = e.target.open; }, true);
$('#bGames').onclick = () => toggleGames();
$('#gamesClose').onclick = () => toggleGames(false);

// ---------- вход/выход ----------
function setHint(t, err) { $('#hint').textContent = t; $('#hint').classList.toggle('err', !!err); }
async function join() {
  const name = $('#name').value.trim(); const room = $('#room').value.trim().replace(/[^\p{L}\p{N}_\-.]/gu, '-');
  if (!name) { $('#name').focus(); return setHint('Введите имя', true); }
  if (!room) { $('#room').focus(); return setHint('Введите название комнаты', true); }
  S.name = name; save(); roomName = room;
  ac().resume?.();
  history.replaceState(null, '', `?room=${encodeURIComponent(room)}`);
  $('#lobby').classList.add('hidden'); $('#call').classList.remove('hidden');
  $('#roomTitle').textContent = room;
  selfTile = makeTile('self', name + ' (вы)');
  selfTile.el.classList.add('self');
  selfTile.video.muted = true;
  inCall = true; renderSelf(); renderButtons();
  connect();
}
function leave() {
  leaving = true; inCall = false; es?.close();
  peers.forEach(p => p.pc.close());
  [local.audio, local.video].forEach(t => t?.stop()); screen?.getTracks().forEach(t => t.stop());
  location.href = location.pathname;
}
addEventListener('beforeunload', () => { leaving = true; es?.close(); });

// ---------- диалог настроек ----------
function openSettings() {
  $('#sRes').value = S.res; $('#sFps').value = S.fps; $('#sScr').value = S.scr;
  $('#sEc').checked = S.ec; $('#sNs').checked = S.ns; $('#sAgc').checked = S.agc; $('#sMirror').checked = S.mirror;
  $('#sJoinMuted').checked = S.joinMuted; $('#sJoinNoCam').checked = S.joinNoCam;
  fillDevices(); renderSelf(); $('#dlg').showModal(); $('#sPrev').play().catch(() => {});
}
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('act', x === b));
  document.querySelectorAll('[data-pane]').forEach(p => p.classList.toggle('hidden', p.dataset.pane !== b.dataset.tab));
});
$('#dlgClose').onclick = () => $('#dlg').close();
$('#dlg').onclick = e => { if (e.target === $('#dlg')) $('#dlg').close(); };
$('#sCam').onchange = e => { S.cam = e.target.value; save(); reacquire('video'); };
$('#sMic').onchange = e => { S.mic = e.target.value; save(); reacquire('audio'); };
$('#sSpk').onchange = e => { S.spk = e.target.value; save(); document.querySelectorAll('#grid video').forEach(applySink); };
$('#sRes').onchange = e => { S.res = e.target.value; save(); reacquire('video'); };
$('#sFps').onchange = e => { S.fps = e.target.value; save(); reacquire('video'); };
$('#sScr').onchange = e => { S.scr = e.target.value; save(); if (screen) screen.getVideoTracks()[0].contentHint = S.scr; };
for (const [id, k] of [['#sEc', 'ec'], ['#sNs', 'ns'], ['#sAgc', 'agc']]) $(id).onchange = e => { S[k] = e.target.checked; save(); reacquire('audio'); };
$('#sMirror').onchange = e => { S.mirror = e.target.checked; save(); renderSelf(); };
$('#sJoinMuted').onchange = e => { S.joinMuted = e.target.checked; save(); };
$('#sJoinNoCam').onchange = e => { S.joinNoCam = e.target.checked; save(); };
if (!('setSinkId' in HTMLMediaElement.prototype)) $('#spkFld').classList.add('hidden');
$('#testSnd').onclick = () => {
  const ctx = ac(); ctx.resume?.();
  const dest = ctx.createMediaStreamDestination(), o = ctx.createOscillator(), g = ctx.createGain();
  o.frequency.value = 660; g.gain.setValueAtTime(.25, ctx.currentTime); g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + .8);
  o.connect(g).connect(dest); o.start(); o.stop(ctx.currentTime + .8);
  const a = new Audio(); a.srcObject = dest.stream; applySink(a); a.play();
};

// ---------- привязки ----------
$('#lSet').innerHTML = $('#bSet').innerHTML = IC.gear;
$('#bScreen').innerHTML = IC.screen; $('#bLeave').innerHTML = IC.leave;
$('#bChat').insertAdjacentHTML('afterbegin', IC.chat);
$('#bGames').insertAdjacentHTML('afterbegin', IC.game);
$('#lMic').onclick = $('#bMic').onclick = toggleMic;
$('#lCam').onclick = $('#bCam').onclick = toggleCam;
$('#lSet').onclick = $('#bSet').onclick = openSettings;
$('#bScreen').onclick = toggleScreen;
$('#bHand').onclick = toggleHand;
$('#bChat').onclick = () => toggleChat();
$('#chatClose').onclick = () => toggleChat(false);
$('#bLeave').onclick = leave;
$('#join').onclick = join;
$('#name').oninput = renderSelf;
for (const i of ['#name', '#room']) $(i).onkeydown = e => { if (e.key === 'Enter') join(); };
$('#copy').onclick = async () => {
  const url = `${location.origin}${location.pathname}?room=${encodeURIComponent(roomName)}`;
  try { await navigator.clipboard.writeText(url); toast('Ссылка скопирована'); } catch { prompt('Ссылка на комнату:', url); }
};
addEventListener('keydown', e => {
  if (!inCall || e.target.matches('input,select,textarea') || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.code === 'KeyM') toggleMic();
  if (e.code === 'KeyV') toggleCam();
});
if (!navigator.mediaDevices?.getDisplayMedia) $('#bScreen').classList.add('hidden');

// ---------- старт ----------
$('#name').value = S.name;
$('#room').value = new URLSearchParams(location.search).get('room') || Math.random().toString(36).slice(2, 8);
renderButtons(); renderSelf();
initMedia();
</script>
</body>
